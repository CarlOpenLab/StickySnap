# StickySnap CI —— Linux 构建（X11；Wayland 不支持，见 README）
name: linux-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # Build on the oldest supported LTS so the AppImage/deb stay
    # compatible with Ubuntu 22.04+ instead of only the current runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            desktop-file-utils

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          cache: true

      - name: Configure
        run: cmake -S portable -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage, deb and portable tar.gz
        env:
          VERSION: '0.0.0-ci'
        run: |
          chmod +x packaging/linux/package.sh
          packaging/linux/package.sh build dist "$VERSION"

      - name: Verify Linux packages
        run: |
          set -euo pipefail
          desktop-file-validate packaging/linux/stickysnap.desktop
          test -x dist/StickySnap-linux-x86_64.AppImage
          dist/StickySnap-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root
          dpkg-deb --info dist/StickySnap-linux-x86_64.deb | grep -E 'Package:|Version:|Architecture:'
          tar -tzf dist/StickySnap-linux-x86_64.tar.gz | grep -q 'StickySnap-linux/AppRun'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StickySnap-linux-x86_64
          path: |
            dist/StickySnap-linux-x86_64.AppImage
            dist/StickySnap-linux-x86_64.deb
            dist/StickySnap-linux-x86_64.tar.gz
            dist/StickySnap-linux-x86_64-sha256.txt
