# StickySnap CI —— Linux 构建（X11；Wayland 不支持，见 README）
name: linux-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          cache: true

      - name: Configure
        run: cmake -S portable -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # 便携包：二进制 + 非 glibc 运行库 + 启动脚本（AppImage 留待后续）
      - name: Package portable tar.gz
        run: |
          mkdir -p StickySnap-linux/lib
          cp build/StickySnap StickySnap-linux/
          SKIP='libc\.so|libm\.so|ld-linux|libpthread|libdl|librt|libgcc_s|libstdc\+\+'
          ldd build/StickySnap | awk '/=> \// {print $3}' | grep -Ev "$SKIP" | while read lib; do
            cp "$lib" StickySnap-linux/lib/
          done
          cat > StickySnap-linux/run.sh <<'EOS'
          #!/bin/sh
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH="$PWD/lib:$LD_LIBRARY_PATH"
          exec ./StickySnap "$@"
          EOS
          chmod +x StickySnap-linux/run.sh StickySnap-linux/StickySnap
          tar -czf StickySnap-linux-x64.tar.gz StickySnap-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickySnap-linux-x64
          path: StickySnap-linux-x64.tar.gz

# 后续：
#   1. linuxdeployqt 出 AppImage / deb 包
#   2. Wayland 支持（portal 全局快捷键 + ScreenCast 抓屏）
