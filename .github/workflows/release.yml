# StickySnap Release —— 推送 v* tag 时构建并发布 Windows 包
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/StickySnap.exe -DestinationPath StickySnap-windows-x64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: StickySnap-windows-x64.zip
          generate_release_notes: true
